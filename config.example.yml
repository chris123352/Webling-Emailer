webling:
  url: "${WEBLING_URL}"
  api_key_env: "WEBLING_API_KEY"
  timeout_seconds: 15

smtp:
  host: "${SMTP_HOST}"
  port: "${SMTP_PORT:-587}"
  username_env: "SMTP_USERNAME"
  password_env: "SMTP_PASSWORD"
  from_address: "${SMTP_FROM_ADDRESS:-}"
  use_tls: true

admin:
  email: "${ADMIN_EMAIL}"

weekly_report:
  enabled: true
  recipients:
    - "C.Dorn1@gmx.de"
    - "vorstand@ssv-schmidhausen.de"

test:
  enabled: true
  redirect_all_mail: true
  recipients: []

logging:
  level: "INFO"
  file: "data/logs/webling-automation.log"
  max_bytes: 1048576
  backup_count: 5

module:
  geburtstagsmails: false
  mitgliedsjubilaeen: false
  adminberichte: false
  health_checks: false
