name: Webling Automation

on:
  workflow_dispatch:
  schedule:
    # Both UTC slots are needed because GitHub Actions cron does not support time zones.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Geplante Startzeit prüfen
        id: schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Berlin date +%H)" != "08" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencies installieren
        if: steps.schedule.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Konfiguration bereitstellen
        if: steps.schedule.outputs.should_run == 'true'
        run: cp config.example.yml config.yml

      - name: Automation ausführen
        if: steps.schedule.outputs.should_run == 'true'
        env:
          WEBLING_API_KEY: ${{ secrets.WEBLING_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: python -m app.main
